services:
  - type: web
    name: ielts-speaking-practice
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: PRONUNCIATION_MODEL
        value: gemini-2.5-flash
      - key: MAX_SESSIONS
        value: "5"
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "8000"
